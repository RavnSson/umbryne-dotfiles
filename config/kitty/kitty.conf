# ========================= #
#      UMBRYNE KITTY        #
# ========================= #
# Palette canonical home: config/rofi/umbryne-theme.rasi

# ---- Font ----
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ---- Window ----
window_padding_width  8
confirm_os_window_close 0
enable_audio_bell     no

# ---- Core colors ----
background            #0A0B0C
foreground            #C5C8C6
cursor                #3AFF8A
cursor_text_color     #0A0B0C
selection_background  #262A30
selection_foreground  none
url_color             #3AFF8A

# ---- Window borders ----
active_border_color   #3AFF8A
inactive_border_color #262A30

# ---- Tab bar ----
tab_bar_style           powerline
active_tab_background   #3AFF8A
active_tab_foreground   #0A0B0C
inactive_tab_background #1C1E22
inactive_tab_foreground #6E7270

# ---- ANSI colors ----
# black
color0  #1C1E22
color8  #262A30
# red
color1  #E35149
color9  #F2655D
# green (Verde terminal)
color2  #3AFF8A
color10 #6FFFAC
# yellow
color3  #D7BA7D
color11 #E3C78A
# blue (Violeta abismal, lightened for legibility)
color4  #7C5CBF
color12 #9B7DD9
# magenta
color5  #8A4DD0
color13 #A66FE8
# cyan
color6  #56D6C2
color14 #7AE8D8
# white (Ceniza)
color7  #C5C8C6
color15 #E6E8E6
